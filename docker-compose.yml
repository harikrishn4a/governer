services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: agentbid
      POSTGRES_USER: agentbid
      POSTGRES_PASSWORD: agentbid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbid"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
